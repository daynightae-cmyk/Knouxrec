<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose what to share</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#07070a; color:#e8e8ec; }
    body { display:flex; flex-direction:column; overflow:hidden; }
    header { padding:16px 20px; border-bottom:1px solid #1f1f29; display:flex; align-items:center; gap:12px; }
    header svg { width:22px; height:22px; color:#ffd479; flex-shrink:0; }
    header h1 { font-size:1rem; font-weight:600; margin:0; letter-spacing:.2px; }
    main { flex:1; overflow-y:auto; padding:16px 20px 0; }
    .sources { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
    .source-card { background:#0f0f15; border:1px solid #1f1f29; border-radius:10px; overflow:hidden; cursor:pointer; transition:box-shadow .15s, border-color .15s; }
    .source-card:hover, .source-card.selected { box-shadow:0 0 0 2px #ffd479; border-color:#ffd479; }
    .thumb { aspect-ratio:16/9; width:100%; background:#07070a; object-fit:cover; }
    .info { padding:10px 12px; }
    .info .name { font-size:.88rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .info .type { font-size:.7rem; color:#8b8b9a; margin-top:2px; text-transform:capitalize; }
    .checkbox-row { display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid #1f1f29; background:#0a0a0f; }
    .checkbox-row label { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:.85rem; }
    .checkbox-row input[type=checkbox] { width:16px; height:16px; accent-color:#ffd479; }
    footer { display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid #1f1f29; background:#0a0a0f; }
    button { padding:8px 16px; border-radius:6px; font-size:.85rem; font-weight:600; cursor:pointer; border:1px solid transparent; transition:background .1s, border-color .1s; }
    .btn-secondary { background:#1a1a24; color:#e8e8ec; border-color:#2a2a38; }
    .btn-secondary:hover { background:#222230; }
    .btn-primary { background:#ffd479; color:#07070a; }
    .btn-primary:hover { background:#ffdb9a; }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .empty { grid-column:1/-1; text-align:center; padding:40px 20px; color:#8b8b9a; font-size:.9rem; }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    <h1>Choose what to share</h1>
  </header>
  <main>
    <div class="sources" id="sources" role="listbox" aria-label="Available screens and windows"></div>
  </main>
  <div class="checkbox-row">
    <label><input type="checkbox" id="shareAudio" /> Share system audio</label>
  </div>
  <footer>
    <button class="btn-secondary" id="cancelBtn">Cancel</button>
    <button class="btn-primary" id="shareBtn" disabled>Share</button>
  </footer>
  <script src="./picker.js"></script>
</body>
</html>
